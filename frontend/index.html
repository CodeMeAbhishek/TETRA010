<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nidan — Welcome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg-body);
      font-family: var(--font-inter);
    }
    .landing-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 3rem;
      max-width: 600px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }
    .logo-container {
      margin-bottom: 2rem;
    }
    .logo-icon {
      font-size: 3rem;
      background: linear-gradient(135deg, var(--brand-blue), var(--brand-teal));
      -webkit-background-clip: text;
      color: transparent;
      line-height: 1;
    }
    .logo-title {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin-top: 0.5rem;
    }
    .logo-sub {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      color: var(--text-secondary);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-top: 0.25rem;
    }
    .role-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-top: 2.5rem;
    }
    .role-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      background: var(--bg-body);
      border: 2px solid var(--border-light);
      border-radius: var(--radius-md);
      text-decoration: none;
      color: var(--text-primary);
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .role-card:hover {
      border-color: var(--brand-blue);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(14, 165, 233, 0.1);
    }
    .role-icon {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }
    .role-title {
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
    }
    .role-desc {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.4;
    }
    @media (max-width: 600px) {
      .role-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="landing-card">
    <div class="logo-container">
      <div class="logo-icon">⚕</div>
      <div class="logo-title">Nidan</div>
      <div class="logo-sub">Clinical Decision Support System</div>
    </div>
    
    <p style="color: var(--text-secondary); margin-bottom: 1rem;">
      Select your role to enter the platform.
    </p>

    <div class="role-grid">
      <a href="consumer.html" class="role-card">
        <div class="role-icon">👤</div>
        <div class="role-title">Patient Portal</div>
        <div class="role-desc">Self-screening conversational assistant. Takes intake and routes to clinician.</div>
      </a>
      
      <a href="clinician.html" class="role-card">
        <div class="role-icon">🩺</div>
        <div class="role-title">Clinician Dashboard</div>
        <div class="role-desc">Review patient queue, assess risks using clinical guidelines, and determine referrals.</div>
      </a>
    </div>
  </div>
</body>
</html>
